<style>
:root {

  --цвет-текст: #2C211A;  --цвет-текст-мягкий: #5C5048;  --цвет-текст-тихий: #9A8E83;
  --цвет-акцент: #183B57;  --цвет-акцент-тёмный: #10263A;  --цвет-акцент-яркий: #2E5978;  --цвет-акцент-глубже: #1F4867;  --цвет-акцент-маркер: #B9722F;
  --цвет-на-акценте: #F6F2EA;  --цвет-линия: #D9CFBF;
  --цвет-тёмный-фон: #10263A;  --цвет-тёмный-фон-2: #183B57;  --цвет-тёмный-текст: #F6F2EA;  --цвет-тёмный-фон-3: #0C1F30;  --цвет-тёмный-фон-4: #0E2335;
  --цвет-тёплый: #B9722F;  --цвет-тёплый-мягкий: #E7D7BF;
  --цвет-стекло: color-mix(in srgb, #10263A 86%, transparent);
  --тень: 0 12px 34px color-mix(in srgb, #10263A 6%, transparent);
  --тень-чип: 0 10px 30px color-mix(in srgb, #10263A 12%, transparent);
  --тень-глубокая: 0 24px 60px color-mix(in srgb, #10263A 35%, transparent);
  --тень-спутник: 0 30px 60px color-mix(in srgb, #10263A 70%, transparent);
  --тень-плиты: 0 40px 100px color-mix(in srgb, #10263A 70%, transparent);
  --кегль-h1: 44px;  --кегль-h2: clamp(28px, 4.5vw, 44px);
  --кегль-текст: clamp(16px, 1vw, 17px);  --кегль-лид: clamp(17px, 1.1vw, 18px);
  --кегль-мелкий: 14px;  --кегль-кикер: clamp(14px, 1.1vw, 15px);
  --кегль-цифра: 30px;  --разрядка-кикера: .03em;
  --отступ-секции: clamp(56px, 9vw, 120px);  --отступ-блока: clamp(16px, 2vw, 28px);
  --отступ-секции-тихо: clamp(44px, 7vw, 94px);  --отступ-секции-громко: clamp(64px, 10.5vw, 140px);
  --ширина: 1120px;  --ширина-колонки: 560px;  --радиус: 16px;  --радиус-малый: 8px;
  --радиус-карточки: 18px;  --радиус-плитки: 22px;  --радиус-телефон: 46px;  --кнопка-радиус: 14px;

  --плавность: cubic-bezier(.2, .7, .2, 1);  --длительность: .25s;

}

</style>
<script>
(function () {
  var ЭТАЛОН = 0.535;                  // очко Open Sans — текстовой гарнитуры утверждённых макетов
  var ПОТОЛОК = 1.2, МЁРТВАЯ = 0.02;   // выше потолка расползается раскладка; ближе к единице не трогаем вовсе
  var КОМПЬЮТЕР = "(min-width: 900px)";
  var ТОКЕНЫ = ["--кегль-текст", "--кегль-лид", "--кегль-мелкий", "--кегль-кикер"];
  var корень = document.documentElement;
  var холст = document.createElement("canvas").getContext("2d");
  var ждём = 0;

  function мера(буква) { var м = холст.measureText(буква); return (м && м.actualBoundingBoxAscent) || 0; }

  function применить() {
    ждём = 0;
    if (!холст) { return; }

    for (var i = 0; i < ТОКЕНЫ.length; i++) { корень.style.removeProperty(ТОКЕНЫ[i]); }
    var стиль = getComputedStyle(корень), стек = стиль.getPropertyValue("--шрифт-текста").trim();
    if (!стек) { return; }
    холст.font = "400 100px " + стек;

    var очко = Math.max(мера("х"), мера("x")) / 100;
    if (!(очко > 0)) { return; }
    var k = Math.round(Math.min(ПОТОЛОК, Math.max(1, ЭТАЛОН / очко)) * 1000) / 1000;
    if (k - 1 < МЁРТВАЯ || !matchMedia(КОМПЬЮТЕР).matches) { k = 1; }
    корень.setAttribute("data-очко", очко.toFixed(3));      // чтобы проверка могла сказать числа вслух
    корень.setAttribute("data-поправка", k.toFixed(3));
    if (k === 1) { return; }
    for (i = 0; i < ТОКЕНЫ.length; i++) {
      var было = стиль.getPropertyValue(ТОКЕНЫ[i]).trim();
      if (было) { корень.style.setProperty(ТОКЕНЫ[i], "calc((" + было + ") * " + k + ")"); }
    }
  }

  применить();

  if (document.fonts && document.fonts.ready) { document.fonts.ready.then(применить); }

  addEventListener("resize", function () { ждём = ждём || requestAnimationFrame(применить); });
})();
</script>

<script>
(function () {
  var СПИТ = "главная-на-виду";                       // класс на body; правило сна — в стилях
  var кнопка = document.querySelector(".первый-экран__действие .кнопка--главная");
  if (!кнопка || !window.IntersectionObserver) { return; }

  function пометить(на_виду) { document.body.classList.toggle(СПИТ, !!на_виду); }

  var б = кнопка.getBoundingClientRect();
  пометить(б.bottom > 0 && б.top < (window.innerHeight || 0));

  requestAnimationFrame(function () {
    requestAnimationFrame(function () { document.body.classList.add("панель-с-переходом"); });
  });

  new IntersectionObserver(function (записи) {
    пометить(записи[записи.length - 1].isIntersecting);
  }, { threshold: 0 }).observe(кнопка);
})();
</script>
